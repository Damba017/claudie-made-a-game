<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Barn Bloom - tests and balance report</title>
  <style>
    body { font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; background: #fffaf0; color: #3a2a22; padding: 1rem; }
    h1 { font-size: 1.1rem; } pre { white-space: pre-wrap; }
    .ok { color: #2f7a3f; } .fail { color: #b3262b; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Barn Bloom: logic tests and balance simulation</h1>
  <p id="status">Running...</p>
  <pre id="tests"></pre>
  <pre id="balance"></pre>
  <script src="../js/config.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/logic.js"></script>
  <script src="../js/combat.js"></script>
  <script src="../js/save.js"></script>
  <script src="logic.test.js"></script>
  <script src="balance.js"></script>
  <script>
    (function () {
      var r = BB.TestResults, status = document.getElementById('status');
      document.getElementById('tests').textContent = r.text;
      status.textContent = r.failed ? 'TESTS FAILED: ' + r.failed : 'ALL ' + r.passed + ' TESTS PASSED';
      status.className = r.failed ? 'fail' : 'ok';
      // The balance run takes a moment, so let the test results paint first.
      setTimeout(function () {
        try { document.getElementById('balance').textContent = BB.Balance.report(); }
        catch (err) { document.getElementById('balance').textContent = 'Balance simulation crashed: ' + err.stack; }
      }, 30);
    })();
  </script>
</body>
</html>
